<style>

<body>
<h1>Le système solaire</h1>
<p class="sub">Touche une planète pour en savoir plus. Pince l’écran pour zoomer.</p>
<div id="stage"><canvas id="c" aria-label="Animation du système solaire"></canvas>

</div>

<path d="M15 27 Q35 0 55 27 Q35 15 15 27Z" fill="#5a3a22"/>
<circle cx="28" cy="31" r="2.5" fill="#222"/><circle cx="42" cy="31" r="2.5" fill="#222"/>

</svg>

<script>
const SOLAR=[
{n:"Mercure",r:3,d:42,s:4.15,c:"#b5b0a8",t:"La plus proche du Soleil et la plus petite. Elle fait le tour du Soleil en 88 jours.",f:"Température : de −180 °C à 430 °C · 0 lune"},
{n:"Vénus",r:5.5,d:62,s:1.62,c:"#e8c27a",t:"La planète la plus chaude, à cause de son épaisse atmosphère. Elle tourne à l’envers par rapport à la plupart des planètes.",f:"Température : 465 °C · 0 lune"},
{n:"Terre",r:5.8,d:84,s:1,c:"#4a90e2",t:"Notre maison, la seule planète connue où la vie existe. Elle est couverte d’eau à 70 %.",f:"Température moyenne : 15 °C · 1 lune"},
{n:"Mars",r:4.2,d:105,s:.53,c:"#d9573b",t:"La planète rouge, colorée par la rouille de son sol. Elle abrite Olympus Mons, le plus grand volcan connu du système solaire.",f:"Température moyenne : −63 °C · 2 lunes"},
{n:"Jupiter",r:13,d:142,s:.084,c:"#d8a878",t:"La géante du système solaire : toutes les autres planètes tiendraient à l’intérieur. Sa Grande Tache Rouge est une tempête vieille de siècles.",f:"Température : −110 °C · plus de 90 lunes"},
{n:"Saturne",r:11,d:182,s:.034,c:"#e6d29a",ring:true,t:"Célèbre pour ses anneaux faits de glace et de roche. Elle est si légère qu’elle flotterait sur l’eau.",f:"Température : −140 °C · plus de 140 lunes"},
{n:"Uranus",r:8,d:216,s:.012,c:"#8fdde0",t:"Une géante de glace couchée sur le côté : elle roule autour du Soleil comme une bille.",f:"Température : −195 °C · 28 lunes"},
{n:"Neptune",r:7.8,d:246,s:.006,c:"#4466e0",t:"La plus lointaine, balayée par des vents de plus de 2 000 km/h. Un tour autour du Soleil dure 165 ans.",f:"Température : −200 °C · 16 lunes"}
];
const SUN={n:"Le Soleil",t:"Une étoile qui contient 99,8 % de la masse du système solaire. Sa lumière met environ 8 minutes à atteindre la Terre.",f:"Surface : 5 500 °C · Cœur : 15 millions °C",c:"#ffb347"};
const cv=document.getElementById("c"),x=cv.getContext("2d");
let P=SOLAR,sun=SUN,zoom=1,panX=0,panY=0,follow=null,gal=null;
let W,H,dpr,sel=SUN,paused=false,mult=1,t=0,last=performance.now();
const speeds=[["lente",.4],["normale",1],["rapide",3]];let si=1;
const stars=Array.from({length:120},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.2+.2}));
function size(){dpr=window.devicePixelRatio||1;const b=cv.parentElement.getBoundingClientRect();W=b.width;H=b.height;cv.width=W*dpr;cv.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}
addEventListener("resize",size);size();
function pos(p){const sc=Math.min(W,H)/2/270;const a=t*p.s*.6+p.d;return{x:W/2+Math.cos(a)*p.d*sc,y:H/2+Math.sin(a)*p.d*sc,sc}}
function info(o){document.getElementById("info").innerHTML=`<h2 style="color:${o.c}">${o.n}</h2><p>${o.t}</p><p class="facts">${o.f}</p>`;document.getElementById("info").style.borderLeftColor=o.c}
function shade(c,a){const n=parseInt(c.slice(1),16),f=v=>Math.max(0,Math.min(255,Math.round(a<0?v*(1+a):v+(255-v)*a)));return `rgb(${f(n>>16)},${f((n>>8)&255)},${f(n&255)})`}
function ring(cx,cy,r,a0,a1){x.strokeStyle="rgba(222,200,150,.85)";x.lineWidth=Math.max(2,r*.3);x.beginPath();x.ellipse(cx,cy,r*1.9,r*.6,-.4,a0,a1);x.stroke();x.strokeStyle="rgba(120,100,70,.6)";x.lineWidth=1;x.beginPath();x.ellipse(cx,cy,r*1.55,r*.49,-.4,a0,a1);x.stroke()}
function drawPlanet(p,cx,cy,r){
x.save();x.shadowColor=p.c;x.shadowBlur=r*.9;x.fillStyle=p.c;x.beginPath();x.arc(cx,cy,r,0,7);x.fill();x.restore();
const a=Math.atan2(H/2-cy,W/2-cx),lx=cx+Math.cos(a)*r*.5,ly=cy+Math.sin(a)*r*.5;
x.save();x.beginPath();x.arc(cx,cy,r,0,7);x.clip();
const g=x.createRadialGradient(lx,ly,r*.1,cx,cy,r*1.15);g.addColorStop(0,shade(p.c,.5));g.addColorStop(.45,p.c);g.addColorStop(1,shade(p.c,-.85));
x.fillStyle=g;x.fillRect(cx-r,cy-r,2*r,2*r);
const N=p.n;
if(N==="Jupiter"||N==="Saturne"||N==="Uranus"||N==="Neptune"){for(let i=-3;i<=3;i++){x.fillStyle=i%2?"rgba(120,70,40,.3)":"rgba(255,240,210,.2)";x.fillRect(cx-r,cy+i*r*.27-r*.09,2*r,r*.18)}}
if(N==="Jupiter"){x.fillStyle="rgba(190,70,40,.8)";x.beginPath();x.ellipse(cx+r*.2,cy+r*.3,r*.25,r*.13,0,0,7);x.fill()}
if(N==="Venus"||N==="Vénus"){for(let i=-2;i<=2;i++){x.fillStyle="rgba(255,245,210,.25)";x.beginPath();x.ellipse(cx,cy+i*r*.35,r,r*.12,.25,0,7);x.fill()}}
if(N==="Terre"){const B=[[-.3,-.2,.35,.28],[.35,.2,.3,.35],[0,.55,.4,.12],[.9,-.5,.25,.2]];x.fillStyle="rgba(70,150,70,.9)";B.forEach(b=>{const px=cx+(((b[0]+t*.12+1)%2)-1)*r;x.beginPath();x.ellipse(px,cy+b[1]*r,b[2]*r,b[3]*r,0,0,7);x.fill()});x.fillStyle="rgba(255,255,255,.55)";for(let i=0;i<4;i++){const px=cx+(((i*.6+t*.2+1)%2)-1)*r;x.beginPath();x.ellipse(px,cy+(i-1.5)*r*.4,r*.35,r*.08,0,0,7);x.fill()}}
if(N==="Mars"){x.fillStyle="rgba(90,30,20,.4)";x.beginPath();x.ellipse(cx-r*.2,cy+r*.1,r*.4,r*.2,.3,0,7);x.fill();x.fillStyle="rgba(255,255,255,.85)";x.beginPath();x.ellipse(cx,cy-r*.9,r*.5,r*.25,0,0,7);x.fill()}
if(N==="Mercure"){x.fillStyle="rgba(60,55,50,.45)";[[-.3,-.2,.18],[.3,.25,.22],[.1,-.5,.12],[-.4,.4,.14]].forEach(c=>{x.beginPath();x.arc(cx+c[0]*r,cy+c[1]*r,c[2]*r,0,7);x.fill()})}
if(!["Mercure","Vénus","Terre","Mars","Jupiter","Saturne","Uranus","Neptune"].includes(N)){x.fillStyle="rgba(0,0,0,.18)";for(let i=0;i<4;i++){const an=i*1.7+N.length;x.beginPath();x.ellipse(cx+Math.cos(an)*r*.4,cy+Math.sin(an*1.3)*r*.4,r*.3,r*.15,an,0,7);x.fill()}}
x.restore()}
function mkGal(type){const a=[];const N=2200;for(let i=0;i<N;i++){let r,an,c;if(type==="ell"){r=Math.pow(Math.random(),1.6);an=Math.random()*6.283;c=Math.random()<.7?"255,225,170":"255,190,140"}else{const b=Math.random()<.22;r=b?Math.random()*.18:Math.pow(Math.random(),.65);an=b?Math.random()*6.283:(i%2)*Math.PI+r*5.2+(Math.random()-.5)*(.5+.3*r);c=b?"255,230,170":(Math.random()<.35?"255,170,200":"170,200,255")}a.push({r,a:an,s:Math.random()*1.6+.6,f:`rgba(${c},${(.35+.55*(1-r)).toFixed(2)})`})}return a}
function drawGal(){const R=Math.min(W,H)*.45,cx=W/2,cy=H/2,rot=t*.05;
const tr=(r,a)=>{const X=Math.cos(a)*r*R,Y=Math.sin(a)*r*R*gal.tilt,c=Math.cos(gal.ang),s=Math.sin(gal.ang);return[cx+X*c-Y*s,cy+X*s+Y*c]};
const g=x.createRadialGradient(cx,cy,0,cx,cy,R*.6);g.addColorStop(0,"rgba(255,235,190,.85)");g.addColorStop(.35,"rgba(255,190,120,.3)");g.addColorStop(1,"rgba(0,0,0,0)");x.fillStyle=g;x.beginPath();x.arc(cx,cy,R*.6,0,7);x.fill();
gal.pts.forEach(p=>{const q=tr(p.r,p.a+rot);x.fillStyle=p.f;x.fillRect(q[0],q[1],p.s,p.s)});
if(gal.jet){x.strokeStyle="rgba(130,180,255,.85)";x.lineWidth=2.5;x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+R*.7,cy-R*.4);x.stroke()}
if(gal.me){const q=tr(.55,.55*5.2+rot);x.fillStyle="#ffd36a";x.beginPath();x.arc(q[0],q[1],4/zoom+1,0,7);x.fill();x.fillStyle="#fff";x.font=(12/zoom)+"px Trebuchet MS, sans-serif";x.textAlign="left";x.fillText("Nous sommes ici",q[0]+8/zoom,q[1]-6/zoom)}}
function draw(now){
const dt=Math.min(now-last,50)/1000;last=now;if(!paused)t+=dt*mult;
x.clearRect(0,0,W,H);
stars.forEach(s=>{x.fillStyle="rgba(255,255,255,.7)";x.beginPath();x.arc(s.x*W,s.y*H,s.r,0,7);x.fill()});
const sc=Math.min(W,H)/2/270;
if(follow&&!gal){const fq=pos(follow);panX=-(fq.x-W/2)*zoom;panY=-(fq.y-H/2)*zoom}
x.save();x.translate(W/2+panX,H/2+panY);x.scale(zoom,zoom);x.translate(-W/2,-H/2);
if(gal){drawGal();x.restore();requestAnimationFrame(draw);return}
const k=sun.k||1,gr=(44*sc+14)*k,g=x.createRadialGradient(W/2,H/2,4,W/2,H/2,gr);g.addColorStop(0,shade(sun.c,.75));g.addColorStop(.4,sun.c);g.addColorStop(1,"rgba(0,0,0,0)");
x.fillStyle=g;x.beginPath();x.arc(W/2,H/2,gr,0,7);x.fill();
x.fillStyle=shade(sun.c,.35);x.beginPath();x.arc(W/2,H/2,Math.max(9,22*sc*k),0,7);x.fill();
P.forEach(p=>{
x.strokeStyle=sel===p?"rgba(255,255,255,.5)":"rgba(255,255,255,.18)";x.lineWidth=1/zoom;
x.beginPath();x.arc(W/2,H/2,p.d*sc,0,7);x.stroke();
const q=pos(p),r=Math.max(7,p.r*sc*1.6);
if(p.ring)ring(q.x,q.y,r,Math.PI,2*Math.PI);
drawPlanet(p,q.x,q.y,r);if(p.ring)ring(q.x,q.y,r,0,Math.PI);
if(sel===p){x.strokeStyle="#fff";x.lineWidth=1.5;x.beginPath();x.arc(q.x,q.y,r+5,0,7);x.stroke();
}
x.fillStyle=sel===p?"#fff":"rgba(255,255,255,.75)";x.font=(sel===p?"bold ":"")+(12/zoom)+"px Trebuchet MS, sans-serif";x.textAlign="center";x.fillText(p.n,q.x,q.y+r+5+10/zoom);
});
x.restore();requestAnimationFrame(draw)}
function tap(e){
const b=cv.getBoundingClientRect(),mx=(e.clientX-b.left-W/2-panX)/zoom+W/2,my=(e.clientY-b.top-H/2-panY)/zoom+H/2;if(gal)return;
let best=null,bd=1e9;
P.forEach(p=>{const q=pos(p),d=Math.hypot(q.x-mx,q.y-my);if(d<bd){bd=d;best=p}});
const sd=Math.hypot(W/2-mx,H/2-my);
if(sd<30/zoom&&sd<bd)sel=sun;else if(bd<32/zoom)sel=best;
if(follow)follow=sel===sun?null:sel;info(sel);say(sel.n+". "+sel.t)}
function setZoom(z){zoom=Math.max(.5,Math.min(10,z))}
const ptr=new Map();let moved=0,pd=1;
const pdist=()=>{const v=[...ptr.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptr.size===1)moved=0;if(ptr.size===2){pd=pdist();moved=99}});
cv.addEventListener("pointermove",e=>{const o=ptr.get(e.pointerId);if(!o)return;const dx=e.clientX-o.x,dy=e.clientY-o.y;ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptr.size===1){moved+=Math.abs(dx)+Math.abs(dy);if(moved>8){follow=null;panX+=dx;panY+=dy}}else if(ptr.size===2){const d=pdist();setZoom(zoom*d/pd);pd=d}});
cv.addEventListener("pointerup",e=>{const was=ptr.size===1&&moved<=8;ptr.delete(e.pointerId);if(was)tap(e)});
cv.addEventListener("pointercancel",e=>ptr.delete(e.pointerId));
cv.addEventListener("wheel",e=>{e.preventDefault();setZoom(zoom*(e.deltaY<0?1.12:.89))},{passive:false});
document.getElementById("zin").onclick=()=>setZoom(zoom*1.4);
document.getElementById("zout").onclick=()=>setZoom(zoom/1.4);
document.getElementById("zfit").onclick=()=>{follow=null;zoom=1;panX=panY=0};
document.getElementById("ztgt").onclick=()=>{if(!gal&&sel!==sun&&P.includes(sel)){follow=sel;setZoom(4)}else{follow=null;panX=panY=0;setZoom(3)}};
document.getElementById("pause").onclick=e=>{paused=!paused;e.target.textContent=paused?"Reprendre":"Pause"};
document.getElementById("speed").onclick=e=>{si=(si+1)%3;mult=speeds[si][1];e.target.textContent="Vitesse : "+speeds[si][0]};
let sound=true,ac;
function blip(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=660;g.gain.setValueAtTime(.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.15);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.15)}catch(e){}}
function talk(v){document.getElementById("mouth").classList.toggle("talk",v);document.getElementById("guide").classList.toggle("talking",v)}
function say(txt){if(!sound)return;blip();if(!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang="fr-FR";u.onstart=()=>talk(true);u.onend=u.onerror=()=>talk(false);speechSynthesis.speak(u)}catch(e){}}
document.getElementById("snd").onclick=e=>{sound=!sound;e.target.textContent=sound?"Son : activé":"Son : coupé";e.target.setAttribute("aria-pressed",sound);if(!sound){try{speechSynthesis.cancel()}catch(x){}talk(false)}else say(sel.n+". "+sel.t)};
const T=(n,d,r,s,c,t,f)=>({n,d,r,s,c,t,f});
const TRAP=[
T("TRAPPIST-1 b",45,6.5,4.2,"#c98a5e","La plus proche de son étoile : une année n’y dure que 1,5 jour. Les mesures du télescope James-Webb indiquent qu’elle n’a sans doute pas d’atmosphère épaisse.","Taille : 1,1 Terre · Année : 1,5 jour"),
T("TRAPPIST-1 c",65,6.4,2.6,"#b9774f","Un monde rocheux brûlant, de la taille de Vénus. Lui non plus ne semble pas avoir d’atmosphère épaisse.","Taille : 1,1 Terre · Année : 2,4 jours"),
T("TRAPPIST-1 d",85,4.6,1.6,"#d6c7a6","Plus petite que la Terre, elle est au bord de la zone où l’eau liquide pourrait exister. On ignore encore si elle a une atmosphère.","Taille : 0,8 Terre · Année : 4 jours"),
T("TRAPPIST-1 e",105,5.3,1.04,"#5f9fc9","L’une des planètes les plus étudiées pour savoir si un monde habitable existe : sa taille et la lumière qu’elle reçoit ressemblent à celles de la Terre.","Taille : 0,9 Terre · Année : 6,1 jours"),
T("TRAPPIST-1 f",125,6.1,.69,"#7fb08a","Dans la zone habitable de son étoile. Reste à savoir si elle possède une atmosphère.","Taille : 1,05 Terre · Année : 9,2 jours"),
T("TRAPPIST-1 g",145,6.6,.51,"#6c93b8","La plus grande de la fratrie, un peu plus grosse que la Terre, elle aussi dans la zone habitable.","Taille : 1,13 Terre · Année : 12,4 jours"),
T("TRAPPIST-1 h",165,4.4,.34,"#98a0c4","La plus lointaine et la plus petite, plus froide que ses sœurs. Un an y dure 19 jours.","Taille : 0,76 Terre · Année : 18,8 jours")];
const PROX=[
T("Proxima d",60,3.8,4.2,"#b79574","La plus proche de son étoile et la plus petite, environ le quart de la masse de la Terre. Elle tourne autour de Proxima en 5 jours.","Année : 5,1 jours"),
T("Proxima b",110,5.8,1.9,"#6fa38a","Une planète rocheuse dans la zone habitable, un peu plus massive que la Terre. Son étoile lance de puissantes éruptions : on ne sait pas si elle a gardé une atmosphère.","Année : 11,2 jours · Masse : au moins 1,07 Terre"),
